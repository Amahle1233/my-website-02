<main id="main">
<section><h1>Product enquiry</h1><p>Tell us what your team needs and get an instant estimate. Orders of 100+ get 10% off, 500+ get 15%.</p>
<form id="enquiryForm" action="https://httpbin.org/post" method="POST" novalidate>
<div class="form-group"><label for="name">Name or organisation *</label><input id="name" name="name" required minlength="2" maxlength="80"><span class="error" id="nameError"></span></div>
<div class="form-group"><label for="email">Email *</label><input id="email" name="email" type="email" required><span class="error" id="emailError"></span></div>
<div class="form-group"><label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required pattern="(\+27|0)[0-9\s\-]{8,12}" placeholder="031 003 1900"><span class="error" id="phoneError"></span></div>
<div class="form-group"><label for="product">Product *</label><select id="product" name="product" required><option value="">-- Select --</option><option>Corporate polo shirt</option><option>Branded hoodie</option><option>Custom cap</option><option>Branded mug</option><option>Gift hamper</option></select><span class="error" id="productError"></span></div>
<div class="form-group"><label for="qty">Quantity (10-5000) *</label><input id="qty" name="qty" type="number" min="10" max="5000" required><span class="error" id="qtyError"></span></div>
<div class="form-group"><label for="date">Needed by *</label><input id="date" name="date" type="date" required><span class="error" id="dateError"></span></div>
<div class="form-group"><label>Delivery</label><div class="radio-row"><label><input type="radio" name="delivery" value="standard" checked> Standard</label><label><input type="radio" name="delivery" value="same-day"> Same-day (+R250)</label></div></div>
<div class="form-group"><label for="notes">Branding notes</label><textarea id="notes" name="notes" rows="3" maxlength="500"></textarea></div>
<div class="form-group"><label class="check"><input type="checkbox" id="consent" name="consent"> I agree to be contacted about this enquiry.</label><span class="error" id="consentError"></span></div>
<button class="btn" type="submit">Submit enquiry</button>
<div id="enquiryResult" class="result" role="status" hidden></div>
</form></section>
</main>
